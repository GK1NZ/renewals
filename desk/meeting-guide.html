<html lang="en">
<head>

<meta name="robots" content="noindex,nofollow">

<title>Meeting Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one-column step flow. Sticky progress header on top, sticky Back/Next bar at the bottom. Ends with a review screen and a formatted underwriter submission. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#0F2233; --muted:#576878; --line:#D3DAE1;
  --accent:#0A6A6E; --accent-ink:#FFFFFF; --accent-soft:#DAEDED; --field:#F7F9FA;
  --ok:#1D7A45; --ok-soft:#DFF1E6; --warn:#9A4A08; --warn-soft:#FBEBDA; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-display:'Sora',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141C; --surface:#13212D; --ink:#E5ECF2; --muted:#93A4B3; --line:#263847;
  --accent:#4FC2C5; --accent-ink:#04262A; --accent-soft:#12393E; --field:#0F1B25;
  --ok:#5CCB8A; --ok-soft:#143826; --warn:#F0A25E; --warn-soft:#3A2814; --bad:#FF8A80; --bad-soft:#3E1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141C; --surface:#13212D; --ink:#E5ECF2; --muted:#93A4B3; --line:#263847;
  --accent:#4FC2C5; --accent-ink:#04262A; --accent-soft:#12393E; --field:#0F1B25;
  --ok:#5CCB8A; --ok-soft:#143826; --warn:#F0A25E; --warn-soft:#3A2814; --bad:#FF8A80; --bad-soft:#3E1B19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100%;padding-bottom:104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.inner{width:100%;max-width:700px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .inner{padding-block:10px 8px}
.brandrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.appname{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.stepcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.crumb{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:19px}

main{padding-block:22px 12px}
.st{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:60ch}
.banner{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;min-height:32px}
.subh{font-family:var(--f-display);font-size:17px;font-weight:600;margin:26px 0 4px}

.tiles{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{position:relative;display:block;cursor:pointer}
.tile input,.chip input,.lcard input{position:absolute;opacity:0;pointer-events:none}
.tbody{display:flex;flex-direction:column;gap:6px;padding:20px 18px;background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:150px;transition:border-color .15s,background .15s}
.tile input:checked+.tbody{border-color:var(--accent);background:var(--accent-soft)}
.tile input:focus-visible+.tbody,.chip input:focus-visible+span,.lcard input:focus-visible+.lbody{outline:3px solid var(--accent);outline-offset:2px}
.ticon{color:var(--accent);display:block;height:40px}
.tname{font-family:var(--f-display);font-weight:600;font-size:19px}
.tdesc{color:var(--muted);font-size:13.5px}

.claims{display:flex;flex-direction:column;gap:12px}
.claimrow{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;background:var(--card,var(--bg))}
.claimrow .full{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px 14px}
.f{min-width:0}
.f.full{grid-column:1/-1}
.lab{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.hint{display:block;color:var(--muted);font-size:12.5px;margin:-1px 0 6px;font-weight:400}
.in,.ta{width:100%;min-width:0;background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;min-height:46px;color:var(--ink)}
.ta{min-height:96px;resize:vertical}
.in:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-family:var(--f-mono);font-size:15px}
.money .in{padding-left:28px;font-family:var(--f-mono);font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);font-size:14.5px;transition:background .12s,border-color .12s}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.count{font-size:13px;color:var(--muted);margin:0 0 10px}
.lcards{display:flex;flex-direction:column;gap:10px}
.lcard{position:relative;display:block;cursor:pointer}
.lbody{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:10px;align-items:center;padding:14px;background:var(--surface);border:2px solid var(--line);border-radius:10px;min-height:68px}
.lname{font-weight:600;display:block}
.ldesc{display:block;color:var(--muted);font-size:13px}
.ltick{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.lcard input:checked+.lbody{border-color:var(--accent);background:var(--accent-soft)}
.lcard input:checked+.lbody .ltick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .inner{display:flex;gap:10px;padding-block:12px}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:15.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{min-width:96px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:8px;font-size:14px;margin:16px 0 0}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-bottom:18px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fig b{display:block;font-family:var(--f-mono);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fig small{color:var(--muted);font-size:12.5px}
.meter{font-size:13px;color:var(--muted);margin:0 0 14px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.rv h3{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:600}
.rv dl{margin:0;padding:4px 14px 8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row dt{color:var(--muted);font-size:13.5px}
.row dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;white-space:pre-wrap}
.row dd.mono{font-family:var(--f-mono);font-size:14px}
.send{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.send h2{font-family:var(--f-display);font-size:17px;margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow .btn{flex:1 1 180px}
.status{font-size:14px;border-radius:8px;padding:10px 12px;margin-top:2px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.info{background:var(--accent-soft)}
.status a{color:inherit;font-weight:600}
details summary{cursor:pointer;font-size:13.5px;color:var(--muted);min-height:32px}
details textarea{width:100%;min-height:180px;margin-top:8px;font-family:var(--f-mono);font-size:12.5px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}
.small{font-size:12.5px;color:var(--muted);margin:0}

.phbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.phlist{display:flex;flex-direction:column;gap:10px}
.ph{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--field);display:block}
.ph .in{min-height:40px;padding:8px 10px;font-size:15px}
.ph small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:0 0 4px}
.phgrid figure{margin:0}
.phgrid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:var(--field)}
.phgrid figcaption{font-size:11.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}

.dochead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:16px 16px 14px;margin-bottom:12px}
.dochead small{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.dochead h2{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:4px 0 6px;overflow-wrap:anywhere}
.dochead p{margin:0;font-size:13px;opacity:.92}
.pill{flex:none;border:1.5px solid currentColor;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;min-width:0}
.tgrid .in{min-height:42px;padding:8px 10px;font-size:15px}
.tgrid .first{grid-column:1/-1}
.tgrid .chip span{min-height:42px}
.qadd{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.qadd button{border:1.5px dashed var(--line);background:none;border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;min-height:38px}
.qadd button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.auto{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.autotask{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;margin-bottom:6px;font-size:14px}
.sigwrap{border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sigwrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.notebox{width:100%;min-height:280px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink)}
.prev{display:block;color:var(--accent);font-size:12.5px;margin:-1px 0 6px;font-weight:500;overflow-wrap:anywhere}
.tp{margin:0;padding:10px 14px 12px 32px}
.tp li{margin:0 0 7px}
.cl{display:flex;flex-direction:column;gap:8px;margin:12px 0 6px}
.clitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:60px;cursor:pointer}
.clitem:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.clitem b{display:block;font-weight:600}
.clitem small{color:var(--muted);font-size:12.5px}
.clitem em{font-style:normal;color:var(--accent);font-weight:600;font-size:13.5px}
.maptbl{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media(max-width:520px){.maprow{grid-template-columns:minmax(0,1fr)}}
.mapsrc b{display:block;overflow-wrap:anywhere}
.mapsrc small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
select.in{min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.askitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.askitem b{display:block}
.askitem p{margin:3px 0 10px;color:var(--muted);font-size:13.5px}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display);font-weight:600;margin:20px 0 8px}
[hidden]{display:none!important}
.sxtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.sxtabs .btn{min-height:40px;padding:0 14px}
.sxtabs .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.qrow.off{opacity:.55}
.qtxt{min-width:0;flex:1}
.qtxt b{display:block;font-weight:600}
.qact{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.qact .linkbtn{font-size:14px;padding:4px 8px}
.editbox{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:14px;margin:12px 0}
.lookup{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lookup a{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;text-decoration:none}
.lookup a:hover{border-color:var(--accent)}
.ac{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin-top:4px;overflow:hidden}.hzrows .hz-hit b{color:var(--bad)}.hzrows .hz-err b,.hzrows .hz-nc b,.hzrows .hz-um b{color:var(--muted);font-weight:500}.aci.acall{color:var(--brand);font-weight:600}.aci{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;cursor:pointer}.aci:last-child{border-bottom:0}.aci:hover,.aci:focus{background:var(--bg)}.acn{padding:10px 12px;font-size:13.5px;color:var(--muted)}.autorows{display:grid;gap:6px;margin:8px 0}.autorows div{display:flex;justify-content:space-between;gap:12px;font-size:14px}.autorows span{color:var(--muted)}.autop{margin-top:8px}.sitemap{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.calcbox{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin:0 0 18px}.calcbox h3{margin:0 0 4px;font-size:16px}.calcbox input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:inherit}
.sitebox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sitebox canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
</style>

</head>

</div></nav>

<script>
/* Email drafts, reminders and file saves on this device. Shared by Broker Desk and the Meeting Guide. */
(function(){

function toEml(input){
  var to=(input.to||[]).join(", "),boundary="bd"+Date.now().toString(36);
  var html=!!input.htmlBody,body=html?input.htmlBody:(input.body||"");
  var b64=function(s){var u=new TextEncoder().encode(s),bin="";for(var i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return btoa(bin).replace(/(.{76})/g,"$1\r\n")};

    if(atts.length)note=(note?note+" ":"")+atts.length+" attachment"+(atts.length===1?" was":"s were")+" saved to your downloads. Add "+(atts.length===1?"it":"them")+" to the draft.";
    var q=[];if(inp.cc&&inp.cc.length)q.push("cc="+encodeURIComponent(inp.cc.join(",")));if(inp.bcc&&inp.bcc.length)q.push("bcc="+encodeURIComponent(inp.bcc.join(",")));

<script>
/* Meeting Guide: data loading that also works from a plain folder, device email and files, and the link to Broker Desk. */
(function(){
"use strict";
/* data files are plain scripts, so they load from a folder on disk as well as from a website */
var of=window.fetch;window.__PF=window.__PF||{};
function viaScript(p){return new Promise(function(res,rej){if(p in window.__PF)return res(window.__PF[p]);var s=document.createElement("script");s.src=p.replace(/\.(json|txt)$/,"-$1")+".js";s.onload=function(){p in window.__PF?res(window.__PF[p]):rej(new Error("missing"))};s.onerror=function(){rej(new Error("load"))};document.head.appendChild(s)})}
window.fetch=function(u,o){var p=typeof u==="string"?u:(u&&u.url)||"";if(/^data\//.test(p)){p=p.split("?")[0];return viaScript(p).then(function(t){return new Response(t,{status:200,headers:{"Content-Type":/\.json$/.test(p)?"application/json":"text/plain"}})},function(){return new Response("",{status:404})})}return of.apply(this,arguments)};

function ls(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
var prof={};try{prof=JSON.parse(ls("rr_profile_me")||"{}")||{}}catch(e){}
var D=window.BDDevice;
var mcp={callTool:async function(server,tool,input){if(tool==="create_draft")return D.draft(input||{});if(tool==="create_event")return D.ics(input||{});var e=new Error("not available");e.code="not_in_manifest";throw e}};
var dl={save:async function(o){var d=o.data;D.saveBlob(o.filename,d instanceof Blob?d:new Blob([d]));return{status:"saved"}}};
var embedded=false;try{embedded=window.parent&&window.parent!==window}catch(e){embedded=true}

/* ---- shared store with Broker Desk, used when the guide is open in its own tab ---- */
function idb(){return new Promise(function(res,rej){try{var rq=indexedDB.open("brokerdesk",1);rq.onupgradeneeded=function(){var d=rq.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("files"))d.createObjectStore("files")};rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)}}catch(e){rej(e)}})}
function inboxPut(key,val){return idb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction("kv","readwrite");tx.objectStore("kv").put(val,key);tx.oncomplete=function(){res()};tx.onerror=tx.onabort=function(){rej(tx.error)}})})}

if(/^content:/i.test(location.protocol)){document.addEventListener("DOMContentLoaded",function(){document.body.innerHTML='<div style="max-width:520px;margin:40px auto;padding:0 18px;font:16px/1.5 system-ui,sans-serif"><h1 style="font-size:22px">The Meeting Guide can\u2019t run from a downloaded file on a phone</h1><p>Phones open one file at a time, so the questions and address data can\u2019t load. Open Broker Desk from its web address instead.</p></div>'})}
var pending=null,onStart=null;
function take(p){if(!p||!p.client&&!p.rid)return;pending=p;if(onStart){var f=onStart;f(p);pending=null}}
try{var raw=ls("bd_meet");if(raw){localStorage.removeItem("bd_meet");var j=JSON.parse(raw);if(j&&Date.now()-(j.at||0)<6e5)pending=j}}catch(e){}
window.addEventListener("message",function(e){var d=e.data;if(!d||typeof d!=="object")return;if(embedded&&e.source!==window.parent)return;if(d.t==="bd_meet")take(d.p)});
if(embedded){try{window.parent.postMessage({t:"bd_ready"},"*")}catch(e){}}

window.BDMG={
  mcp:mcp,dl:dl,profile:prof,embedded:embedded,
  linzKey:function(){var k=ls("bd_linzkey");return /^[0-9a-f]{32}$/i.test(k)?"":k},
  ldsKey:function(){var k=ls("bd_ldskey");if(k)return k;k=ls("bd_linzkey");return /^[0-9a-f]{32}$/i.test(k)?k:""},
  /* the guide calls this once its questions are loaded; any client handed over from Broker Desk is applied then */
  ready:function(fn){onStart=fn;if(pending){var p=pending;pending=null;fn(p)}},
  send:async function(out){
    out.t="bd_meet_done";
    if(embedded){window.parent.postMessage(out,"*");return "sent"}
    await inboxPut("inbox:"+(out.rid||out.row.client||"x")+":"+Date.now(),out);
    try{localStorage.setItem("bd_inbox",String(Date.now()))}catch(e){}
    return "stored";
  },
  back:function(){if(embedded){try{window.parent.postMessage({t:"bd_close"},"*")}catch(e){}}else location.href="index.html"}
};
})();
</script>

async function saveTemplate(sg){
  if(!dl)return;
  var hdr=['Type'];if(sg==='commercial')hdr.push('Industry');hdr.push('Policy lines');
  CLIENT.forEach(function(q){if(!q.seg||q.seg===sg)hdr.push(q.label);});
  PROFILE[sg].q.forEach(function(q){hdr.push((sg==='commercial'?'Business':'Household')+': '+q.label);});
  allLinesFor(sg).forEach(function(l){LINES[l].q.forEach(function(q){hdr.push(LINES[l].name+': '+q.label);});});
  try{
    await dl.save({filename:'renewal-import-template-'+sg+'.csv',data:'﻿'+hdr.map(csvCell).join(',')+'\r\n'});

  }catch(e){var c=e&&e.code;setStatus('pre',c==='declined'?'info':'bad',c==='declined'?'Save cancelled.':'The template could not be saved here.');}

function initSig(){
  var cv=document.getElementById('sigpad');if(!cv)return;
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  var cx=cv.getContext('2d');cx.scale(dpr,dpr);cx.fillStyle='#fff';cx.fillRect(0,0,r.width,r.height);
  cx.lineWidth=2.4;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#0F2233';
  if(state.sig){var im=new Image();im.onload=function(){cx.drawImage(im,0,0,r.width,r.height);};im.src=state.sig;}
  var drawing=false,last=null;
  function pt(e){var b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();drawing=true;last=pt(e);try{cv.setPointerCapture(e.pointerId);}catch(x){}cx.beginPath();cx.arc(last.x,last.y,1.1,0,6.3);cx.fillStyle='#0F2233';cx.fill();});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pt(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;});
  function end(){if(!drawing)return;drawing=false;
    var t=document.createElement('canvas');t.width=600;t.height=Math.max(1,Math.round(600*r.height/r.width));var tx=t.getContext('2d');tx.fillStyle='#fff';tx.fillRect(0,0,t.width,t.height);tx.drawImage(cv,0,0,t.width,t.height);
    state.sig=t.toDataURL('image/png');save();}
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
}

function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){URL.revokeObjectURL(u);res(im);};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('decode'));};im.src=u;});}
function toBlob(cv,q){return new Promise(function(res){cv.toBlob(res,'image/jpeg',q);});}
async function compress(file){
  var im=await loadImg(file),tries=[[1280,0.68],[1100,0.55],[900,0.5],[720,0.45]],blob=null;
  for(var i=0;i<tries.length;i++){
    var sc=Math.min(1,tries[i][0]/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
    var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
    blob=await toBlob(cv,tries[i][1]);
    if(blob&&blob.size<=PHOTO_TARGET)break;
  }
  return blob;
}
async function addFiles(files){
  photoMsg='';
  for(var i=0;i<files.length;i++){
    if(photos.length>=MAX_PHOTOS){photoMsg='Up to '+MAX_PHOTOS+' photos per submission.';break;}
    try{
      var blob=await compress(files[i]);
      if(!blob){photoMsg='One photo could not be processed.';continue;}
      if(photoTotal()+blob.size>PHOTO_BUDGET){photoMsg='That photo would take the total over '+kb(PHOTO_BUDGET)+'. Remove one first, or send the rest in a second email.';break;}
      photos.push({id:'p'+Date.now()+'_'+i,caption:'',name:files[i].name,blob:blob,size:blob.size,url:URL.createObjectURL(blob)});
    }catch(e){photoMsg='One photo could not be read. Try taking it again.';}
  }
  var el=document.getElementById('photoarea');if(el)el.innerHTML=photoArea(true);
}

function buildModel(){
  var rows=[],asked=0,answered=0,sums=0,fig={turnover:0,wages:0,staff:0};
  function addSection(title,scope,qs,count){
    qs.forEach(function(q){
      if(!isShown(scope,q))return;
      var v=get(scope,q.id);
      if(count)asked++;
      if(isEmpty(v))return;
      if(isLst(q)&&!lstClean(q,v).length)return;
      if(count)answered++;
      var disp=isLst(q)?lstJoin(q,v):Array.isArray(v)?v.join('; '):q.type==='num'?money(v):q.type==='date'?fmtDate(v):String(v);
      var rawv=isLst(q)?disp:Array.isArray(v)?v.join('; '):String(v);
      rows.push({section:title,scope:scope,qid:q.id,label:q.label,disp:disp,raw:rawv,mono:q.type==='num'});
      if(q.sum)sums+=num(v);
      if(scope==='profile'&&q.id==='turnover')fig.turnover=num(v);
      if(scope==='profile'&&q.id==='wages')fig.wages=num(v);
    });
  }
  addSection('Client','client',CLIENT,false);
  if(state.seg==='commercial'&&IND[state.ind])rows.push({section:'Client',scope:'client',qid:'_ind',label:'Industry',disp:IND[state.ind].name,raw:IND[state.ind].name,mono:false});
  if(state.seg)addSection(PROFILE[state.seg].title,'profile',profileQs(),true);
  onLines().forEach(function(l){addSection(LINES[l].name,'line:'+l,lineQs(l),true);});
  addSection('Visit record','visit',visitQs().concat(ACTION_DATES),false);
  addSection('Client confirmation','decl',DECL,false);
  if(state.sig)rows.push({section:'Client confirmation',scope:'decl',qid:'sig',label:'Signature',disp:'Captured (attached as client-signature.png)',raw:'Captured',mono:false});
  if(state.seg==='commercial'&&IND[state.ind]&&IND[state.ind].feat.indexOf('dwx')>-1&&(state.lines.indexOf('liab')>-1||state.lines.indexOf('cworks')>-1)){
    var dwa=get('profile','dw_ext');
    rows.push({section:'Quote request to insurer',scope:'quote',qid:'dwx',label:'Defective workmanship / PBWO extension',disp:'Please quote the Defective Workmanship and Property Being Worked On (PBWO) extension as a separate option. Show the limit, excess, any sub-limit or aggregate, conditions and exclusions, and say if it is not available.'+(dwa?' Client position: '+dwa+'.':''),raw:'Quote requested',mono:false});
  }
  askGroups().forEach(function(g){g.items.forEach(function(it){var v=state.ask[it.id];if(!v)return;var w=v==='d'?'Discussed':v==='f'?'Follow up':'Not relevant';rows.push({section:'Ask and consider',scope:'ask',qid:it.id,label:it.t,disp:w,raw:w,mono:false});});});
  var si=(state.site&&state.site.items)||[];
  if(si.length&&hasPropLine()){
    var tb=0,tf=0,ts2=0;
    si.forEach(function(it){if(it.kind==='bld'){tb+=it.area;tf+=it.area*(it.storeys||1);rows.push({section:'Site plan (approximate)',scope:'site',qid:'b_'+it.name,label:it.name+' footprint',disp:it.area.toLocaleString('en-NZ')+' m2'+((it.storeys||1)>1?' over '+it.storeys+' storeys':''),raw:String(it.area),mono:false});}else ts2+=it.area;});
    if(tb)rows.push({section:'Site plan (approximate)',scope:'site',qid:'tb',label:'Total building footprint',disp:tb.toLocaleString('en-NZ')+' m2',raw:String(tb),mono:false});
    if(tf&&tf!==tb)rows.push({section:'Site plan (approximate)',scope:'site',qid:'tf',label:'Total floor area (footprint x storeys)',disp:tf.toLocaleString('en-NZ')+' m2',raw:String(tf),mono:false});
    if(ts2)rows.push({section:'Site plan (approximate)',scope:'site',qid:'ts',label:'Site area',disp:ts2.toLocaleString('en-NZ')+' m2',raw:String(ts2),mono:false});
    rows.push({section:'Site plan (approximate)',scope:'site',qid:'basis',label:'Basis',disp:'Measured by the broker from a marked-up map image. Approximate only, not a survey.',raw:'Approximate, marked-up map image',mono:false});
  }
  var au=state.auto;
  if(au&&au.addr){var SR='Address look-up (LINZ)';
    rows.push({section:SR,scope:'auto',qid:'a',label:'Address matched',disp:au.addr,raw:au.addr,mono:false});
    if(au.parea)rows.push({section:SR,scope:'auto',qid:'pa',label:'Land parcel area (legal title)',disp:au.parea.toLocaleString('en-NZ')+' m2',raw:String(au.parea),mono:false});
    rows.push({section:SR,scope:'auto',qid:'ba',label:'Building outlines on the parcel (ground footprint)',disp:au.bsum?au.bsum.toLocaleString('en-NZ')+' m2 in '+au.bcnt+' building'+(au.bcnt===1?'':'s'):'None recorded in the dataset',raw:String(au.bsum||0),mono:false});
    if(au.flood)au.flood.forEach(function(f,n){rows.push({section:SR,scope:'auto',qid:'fl'+n,label:f[0],disp:f[1],raw:f[1],mono:false});});
    if(photos.some(function(p){return p.id==='sitemap';}))rows.push({section:SR,scope:'auto',qid:'map',label:'Site photo',disp:'Attached as a photo (site-aerial.jpg)',raw:'Attached',mono:false});
    if(au.x)rows.push({section:SR,scope:'auto',qid:'sat',label:'Satellite view',disp:satUrl(au),raw:satUrl(au),mono:false});
    rows.push({section:SR,scope:'auto',qid:'src',label:'Basis',disp:'Indicative only. Parcel and building outlines from LINZ (CC BY 4.0). Footprint is ground area, not floor area. Flood layers are council planning maps, not a risk rating.',raw:'Indicative, LINZ and council open data',mono:false});}
  addSection('Notes','notes',NOTES,false);
  return {rows:rows,asked:asked,answered:answered,sums:sums,fig:fig};
}
function groupRows(rows){var o=[],idx={};rows.forEach(function(r){if(idx[r.section]==null){idx[r.section]=o.length;o.push({title:r.section,rows:[]});}o[idx[r.section]].rows.push(r);});return o;}
function clientName(){return get('client','name')||'Client';}
function segLabel(){return state.seg?SEG[state.seg].label:'';}
function ts(){return new Date().toLocaleString('sv-SE');}
function newRid(){var d=new Date();return 'R'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'-'+Math.random().toString(36).slice(2,5).toUpperCase();}
function lineNames(){return onLines().map(function(l){return LINES[l].name;}).join(', ');}

function sectionsFor(kind,m){
  if(kind==='internal')return groupRows(m.rows);
  if(kind==='client')return groupRows(m.rows.filter(function(r){return ['notes','visit','decl','ask'].indexOf(r.scope)<0;}));
  /* underwriter */
  var c=function(id){return get('client',id);}, p=function(id){return get('profile',id);};
  var sum=[];
  function add(l,v){if(!isEmpty(v))sum.push({label:l,disp:String(v)});}
  add('Client',c('name'));add('Industry',state.seg==='commercial'&&IND[state.ind]?IND[state.ind].name:'');add('Renewal date',c('renewal')?fmtDate(c('renewal')):'');
  add('Current insurer',c('insurer'));add('Expiring annual premium',c('premium')?money(c('premium')):'');add('Policy number(s)',c('policyNo'));add('Policy lines',lineNames());
  if(state.seg==='commercial'){add('Employees (FTE)',p('staff'));add('Turnover, last 12 months (ex GST)',m.fig.turnover?money(m.fig.turnover):'');add('Wages and salaries',m.fig.wages?money(m.fig.wages):'');}
  add('Total declared sums and values (NZD)',m.sums?money(m.sums):'');
  add('Claims in the last 3 years',p('claims'));
  var out=[{title:'Risk summary',rows:sum}];
  var qr=m.rows.filter(function(r){return r.scope==='quote';});if(qr.length)out.push({title:'Quote request to insurer',rows:qr});
  if(!isEmpty(get('notes','terms')))out.push({title:'Terms and changes requested',rows:[{label:'Requested',disp:get('notes','terms')}]});
  if(!isEmpty(get('notes','improve')))out.push({title:'Risk improvements',rows:[{label:'Improvements',disp:get('notes','improve')}]});
  var dout=get('visit','docsOut');if(Array.isArray(dout)&&dout.length)out.push({title:'Documents to follow',rows:dout.map(function(d){return {label:d,disp:'To follow from the client'};})});
  var contact=m.rows.filter(function(r){return r.scope==='client'&&['contact','phone','email'].indexOf(r.qid)>-1;});
  if(contact.length)out.push({title:'Client contact',rows:contact});
  groupRows(m.rows.filter(function(r){return ['client','notes','visit','decl','ask','quote'].indexOf(r.scope)<0;})).forEach(function(s){out.push(s);});
  var un=get('notes','uw');if(!isEmpty(un))out.push({title:'Notes for the underwriter',rows:[{label:'Notes',disp:un}]});
  var dc=m.rows.filter(function(r){return r.scope==='decl';});if(dc.length)out.push({title:'Client confirmation',rows:dc});
  var att=[];photos.forEach(function(ph,i){att.push({label:'Photo '+(i+1),disp:ph.caption||ph.name||'Photo'});});
  if(state.sig)att.push({label:'Client signature',disp:'client-signature.png'});
  if(window.jspdf)att.push({label:'Submission PDF',disp:pdfName()});
  att.push({label:'Renewal data (CSV)',disp:csvName()});
  out.push({title:'Attachments',rows:att});
  return out;
}
function textDoc(head,secs,foot){
  var o=head.slice();

  if(foot){o.push('');o.push(foot);}
  return o.join('\n');
}
function htmlDoc(heading,introHtml,secs,footHtml){

function csvCell(s){s=String(s==null?'':s);if(/^[=+@]/.test(s)||(/^-/.test(s)&&isNaN(Number(s))))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function buildCSV(m){
  var t=ts(),out=[['Submission ID','Submitted','Type','Client','Renewal date','Section','Question','Answer']];
  m.rows.forEach(function(r){out.push([state.rid,t,segLabel(),get('client','name')||'',get('client','renewal')||'',r.section,r.label,r.mono?r.raw.replace(/\D/g,''):r.raw]);});
  return '﻿'+out.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
}

/* ---------- actions ---------- */
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s||'');}
function gmailError(area,e){
  var c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')setStatus(area,'bad','Email is not connected. Add Email in Settings.');
  else if(c==='needs_reauth')setStatus(area,'bad','Email needs reconnecting. Reconnect it in Settings.');
  else if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required'||c==='blocked_by_policy')setStatus(area,'warn','Email access was not allowed for this page. Tap the button again and choose Allow when asked.');
  else if(c==='tool_error')setStatus(area,'bad','Email refused the draft: '+esc(String((e&&e.message)||'unknown error').slice(0,160)));
  else setStatus(area,'warn','Email did not answer. A draft may or may not have been created, so check your Email drafts before trying again.');
}
async function makeDraft(area,input,okText){
  if(busy||!mcp)return;
  var size=new Blob([JSON.stringify(input)]).size;
  if(size>INPUT_LIMIT){setStatus(area,'bad','This email is too large to draft ('+kb(size)+'). Remove a photo or two and try again.');return;}
  busy=true;setBusy();setStatus(area,'info','Creating the draft…');
  try{
    var r=await mcp.callTool('Mail','create_draft',input);
    var p=r&&r.payload,url=p&&typeof p==='object'&&typeof p.viewUrl==='string'&&/^https:\/\//.test(p.viewUrl)?p.viewUrl:'';
    setStatus(area,'ok','Draft ready for '+esc((input.to||[]).join(', '))+'. '+esc(window.BDDevice.msg(1))+(url?' <a href="'+esc(url)+'" target="_blank" rel="noopener">Open draft</a>':''));
  }catch(e){gmailError(area,e);}
  finally{busy=false;setBusy();}
}
function setBusy(){document.querySelectorAll('[data-act="email"],[data-act="client"],[data-act="uw"],[data-act="crm"],[data-act="bdsave"]').forEach(function(b){b.disabled=busy;});}

async function sendClient(){

async function sendUW(){

var main=document.getElementById('main');
function validate(step){
  if(step==='type'&&!state.seg)return 'Choose Domestic or Commercial to continue.';
  if(step==='industry'&&!state.ind)return 'Choose the closest industry to continue.';
  if(step==='client'&&!String(get('client','name')||'').trim())return 'Enter the client or business name to continue.';

function render(keepScroll){
  if(setup){renderSetup(true);return;}
  var steps=stepList();
  if(state.i>=steps.length)state.i=steps.length-1;
  if(state.i<0)state.i=0;
  var s=steps[state.i],v;
  if(s==='review'||s==='uw'||s==='crm')smEnsure();

  else if(s==='profile')v=state.seg?profileView():'<p class="lead">Choose a renewal type first.</p>';
  else if(s==='visit')v=visitView();else if(s==='actions')v=actionsView();else if(s==='decl')v=declView();else if(s==='crm')v=crmView();
  else if(s==='site')v=siteView();else if(s==='notes')v=notesView();else if(s==='review')v=reviewView();else if(s==='uw')v=uwView();else v=lineView(s.slice(5));
  main.innerHTML=v+'<div id="stepErr"></div>';
  applyShow();
  if(s==='decl')initSig();
  if(s==='site')initSite();
  if(s==='pre'&&imp&&!state.prev){document.querySelectorAll('.mapsel').forEach(function(sel){sel.value=imp.map[+sel.dataset.col]||'';});}
  if(s==='review'||s==='uw'||s==='crm')snapshotClient();
  if(s==='crm'&&caps.mcp&&calProv()==='google'&&state.calAuto!==false&&!calBlocked)setTimeout(function(){calSync(true);},500);
  document.getElementById('stepcount').textContent='Step '+(state.i+1)+' of '+steps.length;
  document.getElementById('barfill').style.width=Math.round((state.i+1)/steps.length*100)+'%';
  document.getElementById('crumb').textContent=stepTitle(s);
  var back=document.getElementById('back'),next=document.getElementById('next');

/* ---------- hover tips on jargon in question labels ---------- */
(function(){
  var T=[
   [/\bNBS\b|earthquake-prone/i,'NBS means New Building Standard. A building below 34% NBS is earthquake-prone under NZ law and may need strengthening.'],
   [/\bEPS\b|expanded polystyrene/i,'Expanded polystyrene foam panels can burn fast and spread fire, so insurers ask where they are used.'],
   [/\bFR\b\)|fire retardant/i,'Fire retardant (FR) grade EPS resists flame spread better than standard grade.'],
   [/\bGVM\b/,'Gross Vehicle Mass: the maximum loaded weight the vehicle is rated for.'],
   [/indemnity period/i,'How long cover keeps paying after damage, until the business is back to normal. Rebuilds and replacing special equipment often take 18 months or more.'],
   [/gross profit/i,'Sales less the costs that rise and fall with sales (stock, materials, freight, commissions). Wages and rent stay in, because they continue during a shutdown.'],
   [/increased costs of working|AICOW|extra costs of working/i,'Additional Increased Cost of Working: the extra you must spend above normal costs to keep trading after an insured loss, such as temporary premises or hire.'],
   [/sum insured/i,'The most the insurer will pay for that item. Set too low, a claim may be only part paid.'],
   [/rebuild cost/i,'What a builder would charge to rebuild to the same standard. It is not market value or rateable value.'],
   [/retroactive date/i,'The earliest date from which past work is covered for claims made now. Keeping it continuous avoids gaps.'],
   [/\bexcess\b/i,'The amount you pay towards each claim before the insurer pays.'],
   [/limit of (liability|indemnity)|limit required/i,'The most the insurer will pay for a claim (or in total for the period).'],
   [/multi-factor|\bMFA\b/i,'A second check when logging in, such as a code from your phone, on top of the password.'],
   [/endpoint protection|antivirus/i,'Security software on computers and servers that detects viruses and ransomware.'],
   [/telematics/i,'Devices that record a vehicle’s location and how it is driven.'],
   [/\bRUC\b/,'Road user charges, paid per distance travelled by diesel and heavy vehicles.'],
   [/\bFTE\b/,'Full-time equivalent. Two half-time staff count as one.'],
   [/producer statement/i,'A statement from a designer or installer confirming the work meets the Building Code.'],
   [/Healthy Homes/i,'NZ standards for rental homes covering heating, insulation, ventilation, moisture and drainage.'],
   [/limitation of liability|limit your liability/i,'A contract clause that caps how much you could owe a client or customer.'],
   [/dual authorisation/i,'Two people must approve a payment before it is made.'],
   [/agreed value|market value/i,'Agreed value: a fixed amount paid on a total loss. Market value: what it was worth at the time of the loss.'],
   [/belonging to others|care, custody/i,'Property you hold or work on for others is often excluded from liability policies unless the cover is extended.'],
   [/hazardous or flammable/i,'Includes fuels, solvents, gas bottles, paints, chemicals and aerosols stored in quantity.'],

   [/trade plates/i,'Plates that let a motor trader drive unregistered or stock vehicles on the road.'],
   [/sprinkler/i,'An automatic fire sprinkler system. It can reduce premiums and the size of a fire loss.'],
   [/agreed|consignment/i,null]
  ].filter(function(x){return x[1]});
  function run(root){
    root.querySelectorAll('.lab, .f > label, label.lab').forEach(function(el){
      if(el.dataset.tipd||el.closest('.chip,.calcbox,.claimrow,.calc')||el.hasAttribute('title'))return;

        if(T[i][0].test(tx)){el.dataset.tipd='1';el.title=T[i][1];var m=document.createElement('span');m.textContent=' ⓘ';m.setAttribute('aria-hidden','true');m.style.cssText='color:var(--muted,#667);cursor:help;font-weight:400';el.appendChild(m);break;}
      }
    });
  }
  function start(){
    var root=document.getElementById('main')||document.querySelector('main');if(!root)return;
    var ob=new MutationObserver(function(){ob.disconnect();try{run(root);}catch(e){}ob.observe(root,{childList:true,subtree:true});});

  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
